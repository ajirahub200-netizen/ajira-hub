  <script>
    function escapeHtml(value){
      return String(value || "").replace(/[&<>"']/g, function(m){
        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];
      });
    }

    function getSlug(){
      const params = new URLSearchParams(window.location.search);
      const querySlug = params.get("slug");

      if(querySlug){
        return querySlug;
      }

      // Supports clean public URLs:
      // /job/ict-officer-vodacom-tanzania-plc
      const parts = window.location.pathname
        .split("/")
        .filter(Boolean);

      const jobIndex = parts.indexOf("job");

      if(jobIndex !== -1 && parts[jobIndex + 1]){
        return decodeURIComponent(parts[jobIndex + 1]);
      }

      return "";
    }

    async function getJob(){
      const slug = getSlug();

      if(!slug){
        throw new Error(
          "Job slug haijapatikana. URL inatakiwa iwe /job/<slug>."
        );
      }

      const SUPABASE_URL =
        "https://jvgvmnzekjkaakgqkoct.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_5h9e4kX950OSHjhKvcGTDg_X8AILbMk";

      const params = new URLSearchParams({
        select: "*",
        slug: `eq.${slug}`,
        status: "eq.published",
        limit: "1"
      });

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);

      let response;

      try{
        response = await fetch(
          `${SUPABASE_URL}/rest/v1/jobs?${params.toString()}`,
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Accept": "application/json"
            },
            signal: controller.signal
          }
        );
      }finally{
        clearTimeout(timeout);
      }

      if(!response.ok){
        const errorText = await response.text().catch(() => "");
        throw new Error(
          `Supabase HTTP ${response.status}: ${errorText}`
        );
      }

      const rows = await response.json();
      const data = rows?.[0];

      if(!data){
        return null;
      }

      // Company lookup is optional. The job itself still loads if this fails.
      let company = "Company";
      let companyLogo =
        data.company_logo_url ||
        "";

      if(data.company_id){
        try{
          const companyParams = new URLSearchParams({
            select: "name,logo_url",
            id: `eq.${data.company_id}`,
            limit: "1"
          });

          const companyResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/companies?${companyParams.toString()}`,
            {
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Accept": "application/json"
              }
            }
          );

          if(companyResponse.ok){
            const companies = await companyResponse.json();
            const companyData = companies?.[0];

            if(companyData){
              company = companyData.name || company;

              if(!companyLogo){
                companyLogo = companyData.logo_url || "";
              }
            }
          }
        }catch(error){
          console.warn("Company lookup skipped:", error);
        }
      }

      let category =
        data.category ||
        data.category_name ||
        "Jobs";

      if(data.category_id){
        try{
          const categoryParams = new URLSearchParams({
            select: "name",
            id: `eq.${data.category_id}`,
            limit: "1"
          });

          const categoryResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/categories?${categoryParams.toString()}`,
            {
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Accept": "application/json"
              }
            }
          );

          if(categoryResponse.ok){
            const categories = await categoryResponse.json();

            if(categories?.[0]?.name){
              category = categories[0].name;
            }
          }
        }catch(error){
          console.warn("Category lookup skipped:", error);
        }
      }

      return {
        ...data,
        company,
        category,
        type: data.job_type || "Full Time",
        companyLogo,
        featuredImage: data.featured_image_url || "",
        applyLink: data.apply_link || "",
        employerEmail: data.employer_email || "",
        employerWhatsapp: data.employer_whatsapp || ""
      };
    }

    function requirementsHtml(requirements){
      if(!requirements){
        return "<p>Hakuna requirements zilizowekwa.</p>";
      }

      const lines=String(requirements)
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

      if(lines.length<=1){
        return "<p>"+escapeHtml(requirements)+"</p>";
      }

      return "<ul>"+lines.map(x=>
        "<li>"+escapeHtml(x.replace(/^[-•*]\s*/,""))+"</li>"
      ).join("")+"</ul>";
    }

    function companyLogoHtml(job){
      if(job.companyLogo){
        return `
          <img
            src="${escapeHtml(job.companyLogo)}"
            alt="${escapeHtml(job.company)} logo"
          >
        `;
      }

      return escapeHtml(
        job.company.substring(0,2).toUpperCase()
      );
    }

    function featuredImageHtml(job){
      if(!job.featuredImage){
        return "";
      }

      return `
        <img
          class="hero-image"
          src="${escapeHtml(job.featuredImage)}"
          alt="${escapeHtml(job.title)}"
        >
      `;
    }

    async function render(){
      const box=document.getElementById("jobContent");

      try{
        const job=await getJob();

        if(!job){
          box.innerHTML=`
            <div class="error-box">
              <h2>Job haijapatikana</h2>
              <p>Link hii inaweza kuwa imefungwa, kufutwa au haipo.</p>
              <a href="/index.html">← Rudi kwenye Jobs</a>
            </div>
          `;
          return;
        }

        const deadline=job.deadline || "Haijawekwa";

        box.innerHTML=`
          <div class="company">
            <div class="company-logo">
              ${companyLogoHtml(job)}
            </div>

            <div>
              <h2>${escapeHtml(job.company)}</h2>
              <div class="location">
                📍 ${escapeHtml(job.location)}
              </div>
              <span class="badge">
                ${escapeHtml(job.category)}
              </span>
            </div>
          </div>

          <h1>${escapeHtml(job.title)}</h1>

          ${featuredImageHtml(job)}

          <div class="meta">
            <span class="full">● ${escapeHtml(job.type)}</span>
            <span>📍 ${escapeHtml(job.location)}</span>
            <span>💼 ${escapeHtml(job.category)}</span>
            <span>📅 Deadline: ${escapeHtml(deadline)}</span>
          </div>

          <div class="share-strip">
            <button class="copy" onclick="copyJobLink()">
              📋 Copy Job Link
            </button>

            <button class="share" onclick="shareWhatsApp()">
              📲 Share WhatsApp
            </button>
          </div>

          <div class="content">
            <h2>Job Description</h2>
            <p>
              ${escapeHtml(job.description || "Maelezo ya job hayajawekwa.")}
            </p>

            <h2>Requirements</h2>
            ${requirementsHtml(job.requirements)}

            <h2>Application Deadline</h2>
            <p><strong>${escapeHtml(deadline)}</strong></p>
          </div>


          <div class="cv-home-message">
            <div class="cv-message-icon">📄</div>
            <div class="cv-message-text">
              <strong>Tengeneza CV bure kupitia Home Page</strong>
              <span>Rudi Home kupata CV Builder.</span>
            </div>
            <a href="/index.html" class="cv-home-link">Rudi Home</a>
          </div>

          <div class="apply-box">
            <h2>How to Apply</h2>

            <p>
              Soma taarifa za nafasi hii vizuri kisha bonyeza
              <strong>Apply Now</strong> kwenda kwenye ukurasa rasmi
              wa maombi.
            </p>

            <div class="buttons" id="applyButtons">
              ${job.applyLink ? `
                <button class="apply" onclick="applyNow()">
                  🚀 Apply Now
                </button>
              ` : ""}

              ${job.employerWhatsapp ? `
                <button class="share" onclick="applyWhatsApp()">
                  📱 Apply via WhatsApp
                </button>
              ` : ""}

              ${job.employerEmail ? `
                <button class="copy" onclick="applyEmail()">
                  📧 Apply via Email
                </button>
              ` : ""}

              <button class="share" onclick="shareWhatsApp()">
                📲 Share WhatsApp
              </button>

              <button class="copy" onclick="copyJobLink()">
                📋 Copy Job Link
              </button>
            </div>

            <div id="message" class="message"></div>
          </div>

          <div class="side-note">
            <strong>💡 Tip</strong>
            Unaweza kushare link hii moja kwa moja kwenye WhatsApp
            Channel, Facebook au Telegram.
          </div>
        `;

        const pageUrl=window.location.href;
        const shareTitle=job.title+" | "+job.company;
        const shareDescription=
          job.location+" • "+job.type+
          ". Soma details na Apply kupitia Ajira & Connection Hub TZ.";
        const shareImage=job.featuredImage || job.companyLogo || "";

        document.title=shareTitle+" | Ajira & Connection Hub TZ";

        document.getElementById("metaDescription").content=
          job.title+" at "+job.company+", "+job.location+
          ". Soma maelezo na namna ya kuomba.";

        document.getElementById("ogTitle").content=shareTitle;
        document.getElementById("ogDescription").content=shareDescription;
        document.getElementById("ogUrl").content=pageUrl;
        document.getElementById("ogImage").content=shareImage;

        document.getElementById("twitterTitle").content=shareTitle;
        document.getElementById("twitterDescription").content=shareDescription;
        document.getElementById("twitterImage").content=shareImage;

        document.getElementById("canonicalUrl").href=pageUrl;

      }catch(error){
        console.error("Job page error:", error);

        box.innerHTML=`
          <div class="error-box">
            <h2>⚠️ Imeshindikana kupakia Job</h2>
            <p>${escapeHtml(error?.message || "Unknown error")}</p>
            <p style="font-size:13px;color:#667085;">
              Slug: ${escapeHtml(getSlug() || "(hakuna slug)")}
            </p>
            <a href="/index.html">← Rudi kwenye Home</a>
          </div>
        `;
      }
    }

    async function copyJobLink(){
      const url=window.location.href;

      try{
        await navigator.clipboard.writeText(url);
        showMessage("✓ Job link ime-copywa.");
      }catch(error){
        window.prompt("Copy Job Link:",url);
      }
    }

    function shareWhatsApp(){
      const url=window.location.href;

      const title=document.title.replace(
        " | Ajira & Connection Hub TZ",
        ""
      );

      const text=
        "🔥 "+title+
        "\n\n👉 Soma details / Apply:\n"+url;

      window.open(
        "https://wa.me/?text="+encodeURIComponent(text),
        "_blank"
      );
    }

    async function applyNow(){
      try{
        const job = await getJob();

        if(!job || !job.applyLink){
          showMessage(
            "Official application link haijawekwa na Admin."
          );
          return;
        }

        let url = job.applyLink.trim();

        if(!/^https?:\/\//i.test(url)){
          url = "https://" + url;
        }

        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );
      }catch(error){
        console.error("Apply link error:", error);
        showMessage(
          "Imeshindikana kufungua application link."
        );
      }
    }

    async function applyWhatsApp(){
      try{
        const job = await getJob();

        if(!job || !job.employerWhatsapp){
          showMessage(
            "WhatsApp ya mwajiri haijawekwa na Admin."
          );
          return;
        }

        let number = String(job.employerWhatsapp)
          .replace(/[^0-9+]/g,"");

        if(/^0[67][0-9]{8}$/.test(number)){
          number = "255" + number.substring(1);
        }

        number = number.replace(/\+/g,"");

        window.open(
          "https://wa.me/" + number,
          "_blank",
          "noopener,noreferrer"
        );
      }catch(error){
        console.error("WhatsApp apply error:", error);
        showMessage(
          "Imeshindikana kufungua WhatsApp ya mwajiri."
        );
      }
    }

    async function applyEmail(){
      try{
        const job = await getJob();

        if(!job || !job.employerEmail){
          showMessage(
            "Email ya mwajiri haijawekwa na Admin."
          );
          return;
        }

        const subject =
          "Application - " + job.title;

        const body =
          "Habari,\n\n" +
          "Nimeona tangazo la " +
          job.title +
          " kupitia Ajira & Connection Hub TZ. " +
          "Ningependa kuomba nafasi hii.\n\n" +
          "Asante.";

        window.location.href =
          "mailto:" +
          encodeURIComponent(job.employerEmail) +
          "?subject=" +
          encodeURIComponent(subject) +
          "&body=" +
          encodeURIComponent(body);

      }catch(error){
        console.error("Email apply error:", error);
        showMessage(
          "Imeshindikana kufungua email ya mwajiri."
        );
      }
    }

    function showMessage(text){
      const el=document.getElementById("message");

      if(el){
        el.textContent=text;

        setTimeout(function(){
          el.textContent="";
        },5000);
      }
    }


    function openChannelPopup(){
      const popup = document.getElementById("channelPopup");
      if(!popup) return;
      popup.classList.add("show");
      popup.setAttribute("aria-hidden","false");
      document.body.classList.add("popup-open");
    }

    function closeChannelPopup(){
      const popup = document.getElementById("channelPopup");
      if(!popup) return;
      popup.classList.remove("show");
      popup.setAttribute("aria-hidden","true");
      document.body.classList.remove("popup-open");
    }

    document.addEventListener("keydown", function(event){
      if(event.key === "Escape") closeChannelPopup();
    });

    document.getElementById("channelPopup")?.addEventListener("click", function(event){
      if(event.target === this) closeChannelPopup();
    });

    render();
    setTimeout(openChannelPopup, 700);
  </script>
</body>
</html>
